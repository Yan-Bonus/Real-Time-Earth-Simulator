appId: org.realtimeearth.simulator
productName: Real-Time Earth Simulator
directories:
  output: release
files:
  - dist/**/*
  - "!dist/textures/**/*"
  - dist-electron/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target: nsis
